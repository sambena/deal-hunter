<!doctype html>
<html lang="en" class="wa-dark cave-accent-teal" data-cave-original="slate">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign in · Deal Hunter · Cougar Cave</title>
  <link rel="icon" href="/cave/icons/tag.svg" type="image/svg+xml">
  <script src="/cave/cave-theme.js"></script>
  <link rel="stylesheet" href="/cave/webawesome/styles/webawesome.css">
  <link rel="stylesheet" href="/cave/cave-theme.css">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/cave/webawesome/webawesome.loader.js" data-webawesome="/cave/webawesome"></script>
  <script type="module" src="/cave/cave-icons.js"></script>
  <script type="module" src="/cave/cave-ui.js"></script>
  <script type="module" src="https://cougarcave.dev/cave/v1/cave-bar.js"></script>
</head>
<body>
<wa-page mobile-breakpoint="700px">
  <!-- The shared Cougar Cave bar (#540, https://cougarcave.dev/cave/v1/cave-bar.js): its app menu comes from
       cougarcave.dev. What is inside is drawn until it loads, and stays if cougarcave.dev can't be reached. -->
  <cave-bar slot="header" id="cave-bar" class="cave-bar cave-brand wa-dark wa-cluster wa-gap-s wa-align-items-center"
            app="deals" name="Deal Hunter" icon="tag" home="/" no-signin>
    <a class="cave-home wa-cluster wa-gap-2xs wa-align-items-center" href="https://cougarcave.dev">
      <img src="/cave/icons/cougar.svg" alt="" width="24" height="24"><span>Cougar Cave</span>
    </a>
    <wa-divider orientation="vertical"></wa-divider>
    <a class="cave-app wa-cluster wa-gap-2xs wa-align-items-center" href="/">
      <wa-icon src="/cave/icons/tag.svg"></wa-icon><span>Deal Hunter</span>
    </a>
    <wa-dropdown>
      <wa-button slot="trigger" appearance="plain" size="s">
        <wa-icon src="/cave/icons/layout-grid.svg" label="Cougar Cave apps"></wa-icon>
      </wa-button>
    </wa-dropdown>
  </cave-bar>

  <!-- What signed-out visitors get: sign in, first-time setup, or an invite / password-reset link. Nothing else
       of Deal Hunter is served until signed in. The card is the shared Cougar Cave one (cave/cave-ui.js). -->
  <main><cave-signin></cave-signin></main>
</wa-page>
<script src="/login.js"></script>
</body>
</html>
