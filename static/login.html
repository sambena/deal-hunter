<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Deal Hunter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- What signed-out visitors get: sign in, first-time setup, or an invite / password-reset link. Nothing else
       of Deal Hunter is served until signed in. -->
  <div id="auth-screen">
  <form id="auth-form" class="panel" hidden>
    <h2 id="title">Sign in to Deal Hunter</h2>
    <p class="muted" id="intro"></p>
    <label data-new>Your name <input name="name" autocomplete="name"></label>
    <label data-email>Email <input name="email" type="email" autocomplete="username"></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <label data-new data-confirm>Password again <input name="password2" type="password" autocomplete="new-password"></label>
    <div class="row"><button class="primary" type="submit" id="go">Sign in</button></div>
    <p id="auth-error"></p>
    <p id="app" hidden><a id="app-link" href="#">Get the Android app</a> <span class="muted" id="app-note"></span></p>
  </form>
  </div>
  <script src="login.js"></script>
</body>
</html>
